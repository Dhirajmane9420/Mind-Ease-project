<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindEase Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #dbeafe, #c7d2fe); /* New Gradient: blue-100 to indigo-200 */
        }
       .main-container {
            background: linear-gradient(to bottom right, #E0D9E6, #C9D2DD, #A3BCCF);
        }
        @keyframes fadeInScaleUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in-scale-up {
            animation: fadeInScaleUp 0.5s ease-out forwards;
        }

        .submit-button .shine-effect {
            display: none;
            position: absolute;
            top: 0;
            left: -100%;
            width: 80px;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            filter: blur(8px);
            animation: shine 1s ease-in-out;
        }

        .submit-button:hover .shine-effect {
            display: block;
        }

        @keyframes shine {
            from {
                left: -100%;
            }
            to {
                left: 100%;
            }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center main-container p-4">

    <div class="w-full max-w-4xl flex bg-white shadow-xl rounded-2xl overflow-hidden animate-fade-in-scale-up">
        
        <!-- Left side - Animation -->
        <div class="hidden md:block w-1/2 h-[600px] relative overflow-hidden border-r border-gray-100">
            <div id="animation-container" class="absolute inset-0 bg-gradient-to-br from-blue-50 to-indigo-100">
                <canvas id="wellness-canvas" class="absolute inset-0 w-full h-full"></canvas>
                
                <!-- Logo and text overlay -->
                <div class="absolute inset-0 flex flex-col items-center justify-center p-8 z-10">
                    <div class="mb-6">
                        <div class="h-12 w-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-200">
                           <i data-lucide="shield-half" class="text-white h-6 w-6"></i>
                        </div>
                    </div>
                    <h2 class="text-3xl font-bold mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
                        MindEase
                    </h2>
                    <p class="text-sm text-center text-gray-600 max-w-xs">
                        A safe and supportive space for your well-being. Sign in to access resources and connect with support.
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Right side - Sign In Form -->
        <div class="w-full md:w-1/2 p-8 md:p-10 flex flex-col justify-center bg-white">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold mb-1 text-gray-800">Welcome Back</h1>
                <p class="text-gray-500 mb-8">Sign in to your account</p>
                
                <div class="mb-6">
                    <button class="w-full flex items-center justify-center gap-2 bg-gray-50 border border-gray-200 rounded-lg p-3 hover:bg-gray-100 transition-all duration-300 text-gray-700 shadow-sm">
                        <svg class="h-5 w-5" viewBox="0 0 24 24">
                          <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill-opacity=".54"></path>
                          <path fill="#4285F4" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                          <path fill="#34A853" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                          <path fill="#FBBC05" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
                          <path fill="#EA4335" d="M1 1h22v22H1z" fill-opacity="0"></path>
                        </svg>
                        <span>Login with Google</span>
                    </button>
                </div>
                
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">or</span>
                    </div>
                </div>
                
                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                          Email <span class="text-blue-500">*</span>
                        </label>
                        <input id="email" type="email" placeholder="Enter your email address" required class="flex h-10 w-full rounded-md border bg-gray-50 border-gray-200 px-3 py-2 text-sm text-gray-800 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                          Password <span class="text-blue-500">*</span>
                        </label>
                        <div class="relative">
                            <input id="password" type="password" placeholder="Enter your password" required class="flex h-10 w-full rounded-md border bg-gray-50 border-gray-200 px-3 py-2 text-sm text-gray-800 placeholder:text-gray-400 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <button type="button" id="password-toggle" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700">
                                <i data-lucide="eye" id="eye-icon" class="h-[18px] w-[18px]"></i>
                                <i data-lucide="eye-off" id="eye-off-icon" class="h-[18px] w-[18px] hidden"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" class="submit-button w-full relative overflow-hidden bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-medium py-2 rounded-lg transition-all duration-300 shadow-lg hover:shadow-blue-200">
                            <span class="flex items-center justify-center">
                                Sign in
                                <i data-lucide="arrow-right" class="ml-2 h-4 w-4"></i>
                            </span>
                            <span class="shine-effect"></span>
                        </button>
                    </div>
                    
                    <div class="text-center mt-6">
                        <a href="#" class="text-blue-600 hover:text-blue-700 text-sm transition-colors">
                          Forgot password?
                        </a>
                    </div>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Don't have an account? <a href="signup.html" class="font-medium text-blue-600 hover:text-blue-700">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- Password Visibility Toggle ---
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('hidden', isPassword);
            eyeOffIcon.classList.toggle('hidden', !isPassword);
        });
        
        // --- Form submission logic ---
        const loginForm = document.getElementById('login-form');
        const API_URL = 'http://localhost:3000'; // **IMPORTANT**: Use your backend URL

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

           const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 2. Send data to the backend login endpoint
                const response = await fetch(`${API_URL}/api/users/login`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email, password }),
    });

                const result = await response.json();

                // 3. Handle the response
                if (response.ok) {
                    // SUCCESS: Save the token and redirect
                   // alert('Login successful!');
                    
                    // The JWT is stored in localStorage to keep the user logged in
                    localStorage.setItem('authToken', result.token);

                    // Redirect to the main student homepage after login
                    window.location.href = 'student_home.html';
                } else {
                    // ERROR: Show the error message from the server
                    alert(`Login Failed: ${result.msg}`);
                }

            } catch (error) {
                console.error('Error during login:', error);
                alert('Could not connect to the server. Please try again later.');
            };
        });

        // --- Navigation for HTML links ---
        document.querySelectorAll('a[href]').forEach(link => {
            if (link.href && link.href.endsWith('.html')) {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    window.location.href = link.href;
                });
            }
        });

        // --- Animated Wellness Canvas Logic ---
        window.addEventListener('load', () => {
            const canvas = document.getElementById('wellness-canvas');
            const container = document.getElementById('animation-container');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            let orbs = [];
            let animationFrameId;

            const setupCanvas = () => {
                const { width, height } = container.getBoundingClientRect();
                canvas.width = width;
                canvas.height = height;
                
                orbs = [];
                const orbCount = Math.floor(width / 30); 
                for(let i = 0; i < orbCount; i++) {
                    const radius = Math.random() * 3 + 2;
                    orbs.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        dx: (Math.random() - 0.5) * 0.5,
                        dy: (Math.random() - 0.5) * 0.5,
                        radius: radius,
                        color: `rgba(59, 130, 246, ${Math.random() * 0.5 + 0.2})`
                    });
                }
            };

            function drawConnections() {
                for (let i = 0; i < orbs.length; i++) {
                    for (let j = i; j < orbs.length; j++) {
                        const dist = Math.hypot(orbs[i].x - orbs[j].x, orbs[i].y - orbs[j].y);
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.moveTo(orbs[i].x, orbs[i].y);
                            ctx.lineTo(orbs[j].x, orbs[j].y);
                            ctx.strokeStyle = `rgba(59, 130, 246, ${1 - dist / 100})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function drawOrbs() {
                orbs.forEach(orb => {
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                    ctx.fillStyle = orb.color;
                    ctx.fill();
                    orb.x += orb.dx;
                    orb.y += orb.dy;
                    if (orb.x < 0 || orb.x > canvas.width) orb.dx *= -1;
                    if (orb.y < 0 || orb.y > canvas.height) orb.dy *= -1;
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawConnections();
                drawOrbs();
                animationFrameId = requestAnimationFrame(animate);
            }

            const resizeObserver = new ResizeObserver(() => {
                cancelAnimationFrame(animationFrameId);
                setupCanvas();
                animate();
            });

            resizeObserver.observe(container);
            setupCanvas();
            animate();
        });
    </script>
</body>
</html>
