<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom right, #dbeafe, #c7d2fe); }
        .sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); z-index: 50; }
        .sidebar.open { transform: translateX(0); }
        @media (min-width: 768px) { #main-panel { transition: margin-left 0.3s ease-in-out; } }
        #mobile-menu-button { --transition-duration: 0.6s; }
        #mobile-menu-button svg { transition: transform var(--transition-duration) ease-out; }
        #mobile-menu-button.open svg { transform: rotate(-45deg); }
        #mobile-menu-button path:nth-child(1) { transition: stroke-dasharray var(--transition-duration) ease-out, stroke-dashoffset var(--transition-duration) ease-out; stroke-dasharray: 12 63; }
        #mobile-menu-button.open path:nth-child(1) { stroke-dasharray: 20 300; stroke-dashoffset: -32.42px; }
        .question-slide { display: none; }
        .question-slide.active { display: block; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app-container" class="relative">
         <aside id="sidebar" class="sidebar bg-violet-50 text-slate-800 w-64 space-y-6 py-7 px-2 fixed inset-y-0 left-0 h-screen">
            <div class="px-4 mb-8"><h2 class="text-xl font-bold text-slate-900">John Doe</h2><p class="text-sm text-slate-500">Student ID: ****1234</p></div>
            <nav class="flex-grow">
                 <a href="student_home.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-indigo-100 hover:text-indigo-700"><i data-lucide="home" class="w-5 h-5"></i><span>Home</span></a>
                 <a href="ai_assistant.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-indigo-100 hover:text-indigo-700"><i data-lucide="bot" class="w-5 h-5"></i><span>AI Assistant</span></a>
                 <a href="resources.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-indigo-100 hover:text-indigo-700"><i data-lucide="book-open-check" class="w-5 h-5"></i><span>Resources</span></a>
                 <a href="peer_support.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-indigo-100 hover:text-indigo-700"><i data-lucide="users" class="w-5 h-5"></i><span>Peer Support</span></a>
                 <a href="test_assessment.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-indigo-700 bg-indigo-100 font-semibold"><i data-lucide="clipboard-list" class="w-5 h-5"></i><span>Test Assessment</span></a>
                 <a href="bookings.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-indigo-100 hover:text-indigo-700"><i data-lucide="calendar-plus" class="w-5 h-5"></i><span>Bookings</span></a>
            </nav>
            <div class="absolute bottom-0 w-full left-0 px-2 pb-4"><a href="welcome.html" id="logout-button" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-700 hover:bg-red-100 hover:text-red-700"><i data-lucide="log-out" class="w-5 h-5"></i><span>Logout</span></a></div>
        </aside>

        <div id="main-panel" class="flex flex-col min-h-screen overflow-hidden">
             <header class="sticky top-0 z-40 w-full border-b border-indigo-200/50 bg-blue-200/70 backdrop-blur-xl">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center h-16"><div class="flex-shrink-0 flex items-center"><i data-lucide="shield-half" class="h-8 w-auto text-indigo-600"></i><span class="ml-2 text-xl font-bold text-slate-900">Wellness Portal</span></div><div class="flex items-center gap-4"><nav class="hidden md:flex items-center gap-8"><a href="student_home.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">Dashboard</a><a href="peer_support.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">Community</a><a href="bookings.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">Appointments</a></nav><div class="md:hidden"><button id="mobile-menu-button"><svg stroke-width="2" fill="none" stroke="currentColor" viewBox="0 0 32 32" class="h-6 w-6 text-slate-800"><path d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path><path d="M7 16 27 16"></path></svg></button></div><div class="relative"><button id="profile-button" class="bg-slate-200 rounded-full h-10 w-10 flex items-center justify-center text-slate-600"><i data-lucide="user" class="w-5 h-5"></i></button><div id="profile-dropdown" class="origin-top-right absolute right-0 mt-2 w-64 rounded-xl shadow-lg bg-white p-4 hidden z-50"></div></div></div></div></div>
            </header>
            <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>
            
            <main class="flex-1 flex items-center justify-center p-4 lg:p-6">
                 <div class="w-full max-w-2xl mx-auto bg-white/80 backdrop-blur-xl rounded-2xl shadow-lg p-8 border border-white/50">
                    <h1 class="text-2xl font-bold text-center text-slate-800">Mental Wellness Check-in</h1>
                    <p class="text-center text-slate-600 mt-2 mb-6">This short, confidential assessment helps you understand your current mindset.</p>
                    
                    <div id="assessment-container">
                        <!-- Questions will be dynamically inserted here -->
                    </div>
                    
                    <div id="navigation-controls" class="flex justify-between items-center mt-6">
                        <button id="back-btn" class="bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg hover:bg-slate-300 transition-colors flex items-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                        <div id="progress-text" class="text-sm font-medium text-slate-500"></div>
                        <button id="next-btn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-2">Next <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                        <button id="finish-btn" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition-colors hidden flex items-center gap-2">Finish Assessment <i data-lucide="check-circle" class="w-4 h-4"></i></button>
                    </div>
                 </div>
            </main>
        </div>
    </div>
    <script>
        lucide.createIcons();
        const profileButton = document.getElementById('profile-button');
        const profileDropdown = document.getElementById('profile-dropdown');
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mainPanel = document.getElementById('main-panel');
        profileButton.addEventListener('click', (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); });
        document.addEventListener('click', (e) => { if (!profileButton.contains(e.target)) profileDropdown.classList.add('hidden'); });
        function toggleSidebar() { sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('hidden'); mobileMenuButton.classList.toggle('open'); }
        mobileMenuButton.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
        sidebarOverlay.addEventListener('click', toggleSidebar);
        if (window.innerWidth >= 768) {
            const triggerZoneWidth = 20;
            document.addEventListener('mousemove', function(e) {
                if (sidebar.classList.contains('open')) return;
                const sidebarRect = sidebar.getBoundingClientRect();
                if (e.clientX <= triggerZoneWidth) { sidebar.style.transform = 'translateX(0)'; mainPanel.style.marginLeft = '256px'; }
                else if (e.clientX > sidebarRect.right + triggerZoneWidth) { sidebar.style.transform = 'translateX(-100%)'; mainPanel.style.marginLeft = '0'; }
            });
            document.body.addEventListener('mouseleave', function() { if (!sidebar.classList.contains('open')) { sidebar.style.transform = 'translateX(-100%)'; mainPanel.style.marginLeft = '0'; }});
        }
        document.querySelectorAll('a[href]').forEach(link => { if (link.href && link.href.includes('.html')) { link.addEventListener('click', e => { e.preventDefault(); window.location.href = link.href; });}});

        // --- Assessment Logic ---
        const assessmentContainer = document.getElementById('assessment-container');
        const backBtn = document.getElementById('back-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');
        const progressText = document.getElementById('progress-text');
        
        const questions = [
            { question: "Over the last 2 weeks, how often have you been bothered by feeling down, depressed, or hopeless?", name: "q1" },
            { question: "How often have you felt nervous, anxious, or on edge?", name: "q2" },
            { question: "How often have you been bothered by having little interest or pleasure in doing things?", name: "q3" },
            { question: "How often have you been unable to stop or control worrying?", name: "q4" },
            { question: "How often have you had trouble relaxing?", name: "q5" },
            { question: "How often have you felt that things have been getting on top of you?", name: "q6" }
        ];
        const options = ["Not at all", "Several days", "More than half the days", "Nearly every day"];
        let currentQuestionIndex = 0;

        function renderAssessment() {
            assessmentContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const slide = document.createElement('div');
                slide.className = `question-slide ${index === currentQuestionIndex ? 'active' : ''}`;
                slide.innerHTML = `
                    <p class="text-lg font-medium text-center text-slate-700 mb-6">${q.question}</p>
                    <div class="space-y-3">
                        ${options.map((option, i) => `
                            <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                                <input type="radio" name="${q.name}" value="${i}" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="ml-4 text-slate-700">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                assessmentContainer.appendChild(slide);
            });
            updateControls();
        }

        function updateControls() {
            backBtn.style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
            nextBtn.style.display = currentQuestionIndex === questions.length - 1 ? 'none' : 'flex';
            finishBtn.style.display = currentQuestionIndex === questions.length - 1 ? 'flex' : 'none';
            progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        }

        function showQuestion(index) {
            document.querySelectorAll('.question-slide').forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            currentQuestionIndex = index;
            updateControls();
        }

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        });

        backBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        });
        
        finishBtn.addEventListener('click', () => {
            assessmentContainer.innerHTML = `
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-green-600">Thank You!</h2>
                    <p class="mt-4 text-slate-600">Your responses have been recorded. Based on your answers, we recommend exploring the <strong>Resources</strong> section for helpful guides and relaxation audios.</p>
                     <p class="mt-2 text-sm text-slate-500">Remember, this is not a diagnosis. If you're feeling distressed, please consider booking an appointment with a counselor.</p>
                    <a href="student_home.html" class="mt-6 inline-block bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700 transition-colors">Back to Home</a>
                </div>
            `;
            document.getElementById('navigation-controls').style.display = 'none';
        });

        renderAssessment();
    </script>
</body>
</html>
