<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Assessment - MindEase Portal</title>
    <script>
        if (!localStorage.getItem('authToken')) window.location.href = 'login.html';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(to bottom right, #dbeafe, #c7d2fe); 
        }
        .sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); z-index: 50; }
        .sidebar.open { transform: translateX(0); }
        @media (min-width: 768px) { #main-panel { transition: margin-left 0.3s ease-in-out; } }
        
        #sidebar { background-color: #f5f3ff; color: #1e293b; width: 16rem; padding-top: 1.75rem; padding-bottom: 1.75rem; position: fixed; top: 0; bottom: 0; left: 0; height: 100vh; display: flex; flex-direction: column; }
        #sidebar .sidebar-content { padding-left: 0.5rem; padding-right: 0.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        #sidebar nav { flex-grow: 1; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1rem; border-radius: 0.5rem; text-decoration: none; color: #334155; transition: background-color 0.2s, color 0.2s; }
        .sidebar-link:hover { background-color: #e0e7ff; color: #4338ca; }
        .sidebar-link.active { background-color: #e0e7ff; color: #4338ca; font-weight: 600; }
        #sidebar .sidebar-footer { padding: 0 0.5rem 1rem 0.5rem; }
        .sidebar-logout { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1rem; border-radius: 0.5rem; text-decoration: none; color: #334155; }
        .sidebar-logout:hover { background-color: #fee2e2; color: #b91c1c; }

        .assessment-bg { background-color: #111827; }
        .animated-card { background-color: #111827; border: 1px solid #1f2937; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }
        .answer-option { background-color: rgba(31, 41, 55, 0.5); border: 1px solid #374151; transition: all 0.2s; }
        .answer-option:hover { border-color: rgba(249, 115, 22, 0.3); }
        input[type="radio"]:checked + .answer-option { border-color: #f97316; background-color: rgba(249, 115, 22, 0.1); }
        .progress-bar-container { width: 100%; background-color: #374151; border-radius: 9999px; overflow: hidden; }
        .progress-bar-fill { height: 0.75rem; background-image: linear-gradient(to right, #f97316, #a855f7); width: 0%; transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app-container" class="relative">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <div class="px-4 mb-8">
                    <h2 id="user-name-sidebar" class="text-xl font-bold text-slate-900">Loading...</h2>
                    <p class="text-sm text-slate-500">Student</p>
                </div>
                <nav>
                     <a href="student_home.html" class="sidebar-link"><i data-lucide="home" class="w-5 h-5"></i><span>Home</span></a>
                     <a href="ai_assistant.html" class="sidebar-link"><i data-lucide="bot" class="w-5 h-5"></i><span>AI Assistant</span></a>
                     <a href="resources.html" class="sidebar-link"><i data-lucide="book-open-check" class="w-5 h-5"></i><span>Resources</span></a>
                     <a href="peer_support.html" class="sidebar-link"><i data-lucide="users" class="w-5 h-5"></i><span>Peer Support</span></a>
                     <a href="test_assessment.html" class="sidebar-link active"><i data-lucide="clipboard-list" class="w-5 h-5"></i><span>Test Assessment</span></a>
                     <a href="bookings.html" class="sidebar-link"><i data-lucide="calendar-plus" class="w-5 h-5"></i><span>Bookings</span></a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <a href="#" id="logout-button" class="sidebar-logout"><i data-lucide="log-out" class="w-5 h-5"></i><span>Logout</span></a>
            </div>
        </aside>

        <div id="main-panel" class="flex flex-col min-h-screen">
            <header class="sticky top-0 z-40 w-full border-b border-indigo-200/50 bg-indigo-300/80 backdrop-blur-lg">
                 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center h-16"><div class="flex items-center"><button id="mobile-menu-button" class="md:hidden mr-4"><i data-lucide="menu" class="h-6 w-6"></i></button><div class="flex-shrink-0 flex items-center"><i data-lucide="shield-half" class="h-8 w-auto text-indigo-600"></i><span class="ml-2 text-xl font-bold text-slate-900">MindEase Portal</span></div></div><div class="flex items-center gap-4"><nav class="hidden md:flex items-center gap-8"><a href="student_home.html" class="text-sm font-medium text-slate-800 hover:text-indigo-600">Dashboard</a><a href="peer_support.html" class="text-sm font-medium text-slate-800 hover:text-indigo-600">Community</a><a href="bookings.html" class="text-sm font-medium text-slate-800 hover:text-indigo-600">Appointments</a></nav><div class="relative"><button id="profile-button" class="bg-slate-200 rounded-full h-10 w-10 flex items-center justify-center text-slate-600"><i data-lucide="user" class="w-5 h-5"></i></button><div id="profile-dropdown" class="origin-top-right absolute right-0 mt-2 w-64 rounded-xl shadow-lg bg-white p-4 hidden z-50"></div></div></div></div></div>
            </header>
            <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>
            
            <main class="flex-1 assessment-bg flex items-center justify-center p-4">
                <div id="quiz-wrapper" class="w-full">
                    </div>
            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // --- Full Sidebar & Header UI Logic ---
        const profileButton = document.getElementById('profile-button');
        const profileDropdown = document.getElementById('profile-dropdown');
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mainPanel = document.getElementById('main-panel');
        const logoutButton = document.getElementById('logout-button');

        if (profileButton) {
            profileButton.addEventListener('click', (event) => {
                event.stopPropagation();
                profileDropdown.classList.toggle('hidden');
            });
        }
        document.addEventListener('click', (event) => {
            if (profileButton && !profileButton.contains(event.target) && profileDropdown && !profileDropdown.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        });

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('hidden');
        }
        if (mobileMenuButton) mobileMenuButton.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleSidebar();
        });
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        if (logoutButton) {
            logoutButton.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('authToken');
                alert('You have been logged out.');
                window.location.href = 'login.html';
            });
        }
        
        // Desktop hover logic
        if (window.innerWidth >= 768) {
            const triggerZoneWidth = 20;
            document.addEventListener('mousemove', function(e) {
                if (sidebar.classList.contains('open')) return;
                const sidebarRect = sidebar.getBoundingClientRect();
                if (e.clientX <= triggerZoneWidth) {
                    sidebar.style.transform = 'translateX(0)';
                    mainPanel.style.marginLeft = '256px';
                } else if (e.clientX > sidebarRect.right + triggerZoneWidth) {
                    sidebar.style.transform = 'translateX(-100%)';
                    mainPanel.style.marginLeft = '0';
                }
            });
            document.body.addEventListener('mouseleave', function() {
                if (!sidebar.classList.contains('open')) {
                    sidebar.style.transform = 'translateX(-100%)';
                    mainPanel.style.marginLeft = '0';
                }
            });
        }

        // --- Page-Specific Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const API_URL = 'http://localhost:3000/api';
            const token = localStorage.getItem('authToken'); 

            const QUIZ_DATA = [
                {
                    category: '🌱 Mood & Energy',
                    questions: [
                        { text: "In the last two weeks, how often have you felt sad, low, or down?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                        { text: "How often have you found it hard to enjoy your usual activities?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                        { text: "How often have you felt tired or lacking energy?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                    ]
                },
                {
                    category: '🌱 Worry & Anxiety',
                    questions: [
                        { text: "In the last two weeks, how often have you felt worried, anxious, or tense?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                        { text: "How often have you found it difficult to stop or control your worrying?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                        { text: "How often have you felt restless or on edge?", options: [ {text: 'Not at all', value: 0}, {text: 'Several days', value: 1}, {text: 'More than half the days', value: 2}, {text: 'Nearly every day', value: 3} ] },
                    ]
                },
                {
                    category: '🌱 General Well-Being',
                    questions: [
                        { text: "In the past month, how often have you been able to concentrate?", options: [ {text: 'Always', value: 0}, {text: 'Often', value: 1}, {text: 'Sometimes', value: 2}, {text: 'Rarely', value: 3} ] },
                        { text: "How often have you felt hopeful about your future?", options: [ {text: 'Always', value: 0}, {text: 'Often', value: 1}, {text: 'Sometimes', value: 2}, {text: 'Rarely', value: 3} ] },
                        { text: "How often have you been able to enjoy your day-to-day life?", options: [ {text: 'Always', value: 0}, {text: 'Often', value: 1}, {text: 'Sometimes', value: 2}, {text: 'Rarely', value: 3} ] },
                    ]
                }
            ];

            const quizWrapper = document.getElementById("quiz-wrapper");
            const userSidebarName = document.getElementById('user-name-sidebar');
            let currentQuestionIndex = 0;
            const allQuestions = QUIZ_DATA.flatMap(cat => cat.questions.map(q => ({...q, category: cat.category})));
            const userAnswers = {};

            async function fetchUserData() {
                if (!token) return;
                try {
                    const response = await fetch(`${API_URL}/users/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (response.ok) {
                        const user = await response.json();
                        if (userSidebarName) userSidebarName.textContent = user.name;
                    } else { throw new Error('Session invalid'); }
                } catch (error) {
                    localStorage.removeItem('authToken');
                    window.location.href = 'login.html';
                }
            }
            
            function renderQuestion(index) {
                // ... (The rest of your quiz logic remains the same)
                 const questionData=allQuestions[index];if(!questionData)return void calculateAndShowResults();const card=document.createElement("div");card.className="animated-card relative w-full max-w-2xl mx-auto rounded-2xl p-8 md:p-12 overflow-hidden shadow-2xl opacity-0 transform scale-95";const answerOptionsHTML=questionData.options.map((e,t)=>`\n                    <label>\n                        <input type="radio" name="answer" value="${e.value}" class="sr-only" ${userAnswers[index]==e.value?"checked":""}>\n                        <div class="answer-option rounded-xl p-4 text-left cursor-pointer">\n                            <span class="font-medium text-white">${e.text}</span>\n                        </div>\n                    </label>`).join("");card.innerHTML=`\n                    <div class="absolute top-4 right-4 w-3 h-3 rounded-full bg-orange-500 animate-pulse"></div>\n                    <div class="absolute bottom-4 left-4 w-3 h-3 rounded-full bg-purple-500 animate-pulse"></div>\n                    <div class="relative z-10">\n                        <div class="mb-8"><div class="progress-bar-container"><div id="progress-bar-fill" class="progress-bar-fill"></div></div></div>\n                        <p class="text-sm font-medium bg-gradient-to-r from-orange-400 to-purple-500 text-transparent bg-clip-text mb-2">${questionData.category}</p>\n                        <h2 class="text-2xl md:text-3xl font-bold text-white mb-8">${questionData.text}</h2>\n                        <div class="space-y-4">${answerOptionsHTML}</div>\n                        <div class="mt-8 flex justify-between items-center">\n                            <button id="prev-btn" type="button" class="text-gray-400 hover:text-white font-medium py-2 px-4 rounded-xl ${0===index?"invisible":""}">Back</button>\n                            <span class="text-gray-500 text-sm">${index+1} / ${allQuestions.length}</span>\n                            <button id="next-btn" type="button" class="bg-gradient-to-r from-orange-600 to-purple-600 hover:from-orange-500 hover:to-purple-500 text-white font-medium py-2 px-6 rounded-xl">${index===allQuestions.length-1?"See Results":"Next"}</button>\n                        </div>\n                    </div>\n                `,quizWrapper.innerHTML="",quizWrapper.appendChild(card),setTimeout(()=>{card.classList.remove("opacity-0","scale-95")},50),updateProgress(),document.getElementById("next-btn").addEventListener("click",()=>{const e=quizWrapper.querySelector('input[name="answer"]:checked');e?(userAnswers[index]=parseInt(e.value),currentQuestionIndex++,renderQuestion(currentQuestionIndex)):alert("Please select an answer.")});const prevBtn=document.getElementById("prev-btn");prevBtn&&prevBtn.addEventListener("click",()=>{currentQuestionIndex--,renderQuestion(currentQuestionIndex)})
            }
            
            function updateProgress() {
                const progressBar = document.getElementById('progress-bar-fill');
                if(progressBar) {
                    const progress = ((currentQuestionIndex + 1) / allQuestions.length) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            }

            function calculateAndShowResults() {
                let totalScore = Object.values(userAnswers).reduce((sum, value) => sum + value, 0);
                let resultTitle, resultText, resultIcon;
                if (totalScore <= 8) {
                    resultTitle = "Managing Well"; resultIcon = "smile";
                    resultText = "Your responses suggest you are managing your emotional well-being effectively right now. Keep prioritizing self-care and connecting with others to maintain this balance.";
                } else if (totalScore <= 17) {
                    resultTitle = "Experiencing Mild to Moderate Challenges"; resultIcon = "meh";
                    resultText = "Your responses suggest you may be facing some emotional challenges. This is common. Exploring our <strong>Resources</strong> or connecting with <strong>Peer Support</strong> could be a helpful next step.";
                } else {
                    resultTitle = "Facing Significant Challenges"; resultIcon = "frown";
                    resultText = "Your responses suggest you may be dealing with a significant level of emotional distress. Please remember that support is available. We strongly encourage you to **Book an Appointment** with a professional counselor.";
                }
                const resultsCard = document.createElement('div');
                resultsCard.className = "animated-card relative w-full max-w-2xl mx-auto rounded-2xl p-8 md:p-12 overflow-hidden shadow-2xl text-center opacity-0 transform scale-95";
                resultsCard.innerHTML = `
                    <div class="relative z-10">
                        <div class="flex justify-center mb-4"><div class="w-16 h-16 bg-gradient-to-br from-orange-500/20 to-purple-500/20 text-orange-400 rounded-full flex items-center justify-center"><i data-lucide="${resultIcon}" class="w-8 h-8"></i></div></div>
                        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-orange-400 to-purple-500 text-transparent bg-clip-text mb-4">${resultTitle}</h1>
                        <p class="text-gray-400 max-w-xl mx-auto mb-8">${resultText}</p>
                        <p class="mt-6 text-xs text-gray-500 font-semibold">DISCLAIMER: This is not a clinical diagnosis. It is a snapshot to help you reflect.</p>
                        <div class="mt-8 flex justify-center gap-4">
                             <a href="student_home.html" class="bg-gray-800/50 border border-gray-700 text-white font-medium py-3 px-8 rounded-xl hover:border-orange-500/30">Back to Home</a>
                        </div>
                    </div>
                `;
                quizWrapper.innerHTML = '';
                quizWrapper.appendChild(resultsCard);
                setTimeout(() => { resultsCard.classList.remove('opacity-0', 'scale-95'); }, 50);
                lucide.createIcons();
            }

            // --- Initial Page Load ---
            fetchUserData();
            renderQuestion(currentQuestionIndex);
        });
    </script>
</body>
</html>
